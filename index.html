<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Alarm</title>
<style>
body {
    font-family: Arial;
    background: #111827;
    color: white;
    text-align: center;
    padding: 40px 15px;
}
.box {
    background: #1f2937;
    padding: 25px;
    border-radius: 15px;
    max-width: 350px;
    margin: auto;
}
input, button {
    padding: 12px;
    margin: 10px;
    border-radius: 8px;
    border: none;
}
button {
    background: #22c55e;
    cursor: pointer;
}
/* FUTURISTIC DESIGN */
body {
    background: radial-gradient(circle at top, #24145c, #080b1c 70%);
    color: #f5f3ff;
    font-family: Arial, sans-serif;
}

.box {
    background: rgba(20, 20, 50, 0.92);
    border: 1px solid #8b5cf6;
    border-radius: 22px;
    box-shadow: 0 0 25px #7c3aed55;
    max-width: 380px;
    margin: auto;
}

h1 {
    color: #a78bfa;
    text-shadow: 0 0 15px #8b5cf6;
}

input {
    background: #11132d;
    color: #67e8f9;
    border: 1px solid #6366f1;
}

button {
    background: linear-gradient(90deg, #7c3aed, #2563eb);
    color: white;
    font-weight: bold;
    border-radius: 12px;
    box-shadow: 0 0 12px #6366f155;
}

button:hover {
    box-shadow: 0 0 22px #8b5cf6aa;
    transform: scale(1.03);
}

#status {
    color: #67e8f9;
    text-shadow: 0 0 8px #06b6d4;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { opacity: 0.7; }
    to { opacity: 1; }
}

@media (max-width: 480px) {
    body { padding: 20px 12px; }
    .box { width: 100%; padding: 22px 16px; }
    h1 { font-size: 26px; }
    input, button { max-width: 100%; }
}
</style>
</head>
<body>
<div class="box">
    <h1>Smart Alarm</h1>
    <div id="clock">00:00:00</div>>
    <p>Choose your alarm time</p>
    <input type="time" id="alarmTime">
    <br>
    <button onclick="setAlarm()">Set Alarm</button>
    <button onclick="stopAlarm()">Stop Alarm</button>
    <h3 id="status">Alarm not set</h3>
</div>
<script>
let alarmTimer;
let audioContext;
let oscillator;
let alarmTriggered = false;

function setAlarm() {
    const time = document.getElementById("alarmTime").value;

    if (!time) {
        alert("Please select a time");
        return;
    }

    clearInterval(alarmTimer);
    stopSound();
    alarmTriggered = false;

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    audioContext.resume();

    document.getElementById("status").textContent = "Alarm set for " + time;

    alarmTimer = setInterval(() => {
        const now = new Date();
        const current =
            String(now.getHours()).padStart(2, "0") + ":" +
            String(now.getMinutes()).padStart(2, "0");
        if (current === time && !alarmTriggered) {
            alarmTriggered = true;
            clearInterval(alarmTimer);
            document.getElementById("status").textContent = "Alarm ringing!";
            playSound();
            setTimeout(startLockEffect,60000);
        }
    }, 1000);
}
function playSound() {
    if (!audioContext || audioContext.state !== "running") return;

    oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 880;
    gain.gain.value = 0.3;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
}

function stopSound() {
    if (oscillator) {
        try { oscillator.stop(); } catch (e) {}
        oscillator = null;
    }
}
function startLockEffect() {
    let seconds = 7200;
    stopSound();
    document.body.innerHTML = `
        <div style="background:#080b1c;color:#67e8f9;
        height:100vh;display:flex;justify-content:center;
        align-items:center;flex-direction:column;
        font-family:Arial;text-align:center;">
            <h1>PHONE LOCKED RAA SOOLEMAGA</h1>
            <h2 id="countdown">02:00:00</h2>
            <p>Lock screen simulation</p>
        </div>`;

    const timer = setInterval(() => {
        seconds--;

        const hrs = String(Math.floor(seconds / 3600)).padStart(2, "0");
        const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
        const secs = String(seconds % 60).padStart(2, "0");

        const countdown = document.getElementById("countdown");

        if (countdown) {
            countdown.textContent = `${hrs}:${mins}:${secs}`;
        }

        if (seconds <= 0) {
            clearInterval(timer);
            location.reload();
        }
    }, 1000);
}
function stopAlarm() {
    clearInterval(alarmTimer);
    stopSound();
    alarmTriggered = true;
    document.getElementById("status").textContent = "Alarm stopped";
}
function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
        now.toLocaleTimeString();
}

setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
